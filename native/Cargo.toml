[workspace]
resolver = "2"
members = ["sandbox-core", "fastagent-sandbox-setup", "fastagent-command-runner"]

[workspace.package]
# 0.2.0：沙箱账户改为显式加入 BUILTIN\Users。已初始化的机器要靠版本抬升触发重新 setup，
# 否则旧账户仍然不在组里，工具链照样不可用。
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
sandbox-core = { path = "sandbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[workspace.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_NetworkManagement_NetManagement",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
